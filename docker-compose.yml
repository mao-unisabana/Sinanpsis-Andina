name: sses
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${PORT_POSTGRES:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_wal_size=4GB", "-c", "checkpoint_timeout=15min"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sses"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      # D38: sin hostname fijo; el emisor sale de la petición (la web lo publica en /realms del mismo origen)
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    ports: ["${PORT_KEYCLOAK:-8180}:8080"]
    volumes:
      - ./infra/keycloak/realm-sses.json:/opt/keycloak/data/import/realm-sses.json:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Sses: Host=postgres;Port=5432;Database=sses;Username=sses_api;Password=sses_api_dev
      Keycloak__MetadataAddress: http://keycloak:8080/realms/sses/.well-known/openid-configuration
      SSES__CLAVE_AES: ${SSES__CLAVE_AES}
      SSES__CLAVE_HMAC: ${SSES__CLAVE_HMAC}
      Cors__Origins: ${PUBLIC_WEB_URL:-http://localhost:${PORT_WEB:-5174}},http://localhost:5174,http://localhost:5173
      Evidencias__Ruta: /data/evidencias
    ports: ["${PORT_API:-5080}:5080"]
    volumes:
      - ./data/evidencias:/data/evidencias
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./frontend
    ports: ["${PORT_WEB:-5174}:80"]
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }

volumes:
  pgdata:
