# D38: Keycloak se sirve en el mismo origen que la app (local, túnel o nube). El esquema público llega de
# cloudflared/Front Door por X-Forwarded-Proto o Cf-Visitor; si no hay proxy delante se usa el de nginx.
map $http_cf_visitor $sses_proto_cf { ~*https https; default $scheme; }
map $http_x_forwarded_proto $sses_proto { '' $sses_proto_cf; default $http_x_forwarded_proto; }

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  # RQ_012: lotes de sincronización con fotos en base64 (el cliente los parte en ≤ 6 MB; un registro con 5 fotos ronda 7 MB)
  location /api/v1/sincronizacion/ { proxy_pass http://api:5080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $sses_proto; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 16m; proxy_read_timeout 180s; }
  location /api/ { proxy_pass http://api:5080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $sses_proto; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 8m; proxy_read_timeout 120s; }
  # Login OIDC (Keycloak) en el mismo origen: solo el realm y sus recursos estáticos; la consola /admin NO se publica
  location /realms/ {
    proxy_pass http://keycloak:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $sses_proto; proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffer_size 128k; proxy_buffers 4 256k; proxy_busy_buffers_size 256k;
  }
  location /resources/ { proxy_pass http://keycloak:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $sses_proto; }

  location /health/ { proxy_pass http://api:5080; }
  location /openapi/ { proxy_pass http://api:5080; }

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
